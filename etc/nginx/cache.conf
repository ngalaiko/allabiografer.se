# The build versions CSS, JavaScript and fonts with a 12-character content hash.
map $arg_v $versioned_asset_cache_control {
    default "no-cache";
    "~^[0-9a-f]{12}$" "public, max-age=31536000, immutable";
}

# Use the original request URI: the analytics proxy rewrites $uri.
# Only successful assets (including conditional/range responses) get long TTLs.
map "$status:$request_uri" $cache_control {
    default "no-cache";
    ~^[0-9]+:/(?:api|salong)/ "";
    ~^(?:200|206|304):/i/[^?]*\.(?:css|js|woff2)(?:\?|$) $versioned_asset_cache_control;
    "~^(?:200|206|304):/posters/[^/?]+-[0-9a-f]{12}(?:-[0-9]+)?\.webp(?:\?|$)" "public, max-age=31536000, immutable";
    "~^(?:200|206|304):/og/[0-9a-f]{20}\.jpg(?:\?|$)" "public, max-age=31536000, immutable";
    ~^(?:200|206|304):/i/[^?]*\.(?:png|ico|svg|webmanifest)(?:\?|$) "public, max-age=86400";
}
