# TLS terminates upstream; directory redirects must not expose HTTP or port 8080.
absolute_redirect off;

# bio.se previously supplied Bagarmossen Folkets Hus's phone number as its city.
rewrite ^/stad/08-649-27-55(?:/(.*))?$ /stad/stockholm/$1 permanent;
# Nortic sometimes included the culture house in Hässleholm's city name.
rewrite ^/stad/hässleholm-kulturhus(?:/(.*))?$ /stad/h%C3%A4ssleholm/$1 permanent;
# Stockholm's districts share one city programme.
rewrite ^/stad/kista(?:/(.*))?$ /stad/stockholm/$1 permanent;

# Verified cinema aliases across bio.se, Nortic and the cinemas' own sites.
# Encode replacement literals so Location headers contain valid ASCII URLs.
rewrite ^/stad/stockholm/stockholm-biocafé-tellus-midsommarkransen(?:/(.*))?$ /stad/stockholm/biocaf%C3%A9-tellus/$1 permanent;
rewrite ^/stad/malmö/malmö-hypnos-theatre(?:/(.*))?$ /stad/malm%C3%B6/hypnos-theatre/$1 permanent;
rewrite ^/stad/götene/götene-bio-göta-lejon(?:/(.*))?$ /stad/g%C3%B6tene/bio-g%C3%B6ta-lejon/$1 permanent;
