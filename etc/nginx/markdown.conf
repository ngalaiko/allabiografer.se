# Only explicit Markdown requests opt in; wildcards keep the browser default.
# A q=0 entry explicitly rejects Markdown.
map $http_accept $accept_markdown {
    default 0;
    "~*(^|,)\s*text/markdown\s*[^,]*;\s*q=0(?:\.0*)?\s*(;|,|$)" 0;
    "~*(^|,)\s*text/markdown\s*(;|,|$)" 1;
}

map $uri $markdown_path {
    ~^(?<html_path>.*)\.html$ $html_path.md;
    default $uri/index.md;
}

map $accept_markdown $markdown_candidate {
    default "";
    1 $markdown_path;
}

types { text/markdown md; }
