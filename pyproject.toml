[project]
name = "allabiografer"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.35",
    "jinja2>=3.1",
    "pillow>=11.0",
]

[project.scripts]
allabiografer = "allabiografer.pipeline:main"
allabiografer-prune = "allabiografer.prune:main"
allabiografer-pull = "allabiografer.sync:main"
allabiografer-newsletter = "allabiografer.newsletter:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allabiografer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
# Intentional Swedish typography (en dash in page titles); not a typo for a hyphen.
allowed-confusables = ["–"]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "TCH",  # flake8-type-checking
    "PERF", # perflint
    "FURB", # refurb
    "LOG",  # flake8-logging
]
ignore = [
    "RET504",  # unnecessary assignment before return
]

[tool.ruff.lint.isort]
known-first-party = ["allabiografer"]

[dependency-groups]
build = [
    "jinja2>=3.1",
    "pillow>=11.0",
]
parse = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
]
dev = [
    "moto[s3]>=5",
    "pytest>=8",
    "ruff>=0.15.8",
]
