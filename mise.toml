[tools]
uv = "latest"

[tasks.lint]
description = "Lint with ruff"
run = "uv run ruff check src/ tests/"

[tasks.format]
description = "Format with ruff"
run = "uv run ruff format src/ tests/"

[tasks.test]
description = "Run tests"
run = [
  "uv run --group dev --group parse --group build pytest",
  "node --test tests/allabiografer/site/*.test.cjs",
]

[tasks.run]
description = "Fetch, parse, merge and render"
run = "uv run --group parse --group build allabiografer"

[tasks.serve]
description = "Serve the rendered site locally"
run = "python -m http.server 8000 -d data/allabiografer/www"
