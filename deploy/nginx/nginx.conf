daemon off;
pid /tmp/nginx.pid;
error_log stderr;

env POSTHOG_PERSONAL_API_KEY;
env POSTHOG_PROJECT_ID;
env POSTHOG_PROJECT_TOKEN;
env POSTHOG_API_HOST;
env POSTHOG_CAPTURE_HOST;
env NEWSLETTER_SIGNING_SECRET;
env NEWSLETTER_CITIES_FILE;

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map_hash_bucket_size 512;
    map_hash_max_size 16384;
    include @openresty@/nginx/conf/mime.types;
    include @conf@/markdown.conf;
    include @conf@/cache.conf;
    default_type application/octet-stream;

    lua_package_path '@conf@/lua/?.lua;@luaPath@;;';
    lua_ssl_trusted_certificate @cacert@;
    lua_ssl_verify_depth 3;
    lua_shared_dict newsletter_locks 1m;
    lua_shared_dict newsletter_pending 10m;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    limit_req_zone $posthog_client_ip zone=newsletter_signup:1m rate=5r/m;
    limit_req_zone $posthog_client_ip zone=newsletter_preferences:1m rate=30r/m;

    sendfile           on;
    keepalive_timeout  65;

    log_format main '$http_fly_client_ip - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log /dev/stdout main;

    map $request_uri $posthog_upstream {
        ~^/salong/(static|array)/ eu-assets.i.posthog.com;
        default eu.i.posthog.com;
    }

    map $http_fly_client_ip $posthog_client_ip {
        "" $remote_addr;
        default $http_fly_client_ip;
    }

    # Brotli compression (preferred, ~15-20% better than gzip)
    brotli on;
    brotli_comp_level 6;
    brotli_min_length 256;
    brotli_types text/css application/javascript application/json application/ld+json text/calendar text/markdown text/plain application/xml text/xml;

    # Gzip fallback for older clients
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json application/ld+json text/calendar text/markdown text/plain application/xml text/xml;

    include @conf@/sites-available/*;
}
