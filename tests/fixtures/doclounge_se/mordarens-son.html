 href=\"https://tempofestival.se/film/mordarens-son/\">Klicka här!</a></p>\n<p>10/4 Premiär på Bio Aspen. För tider och biljetter: <a href=\"https://www.bioaspen.se/movies/mordarens-son/\">Klicka här!</a></p>\n<p>10/4 Premiär på Zita Folkets Bio. För tider och biljetter: <a href=\"https://zita.se/start/filmer/mordarens-son\">Klicka här!</a></p>\n<p>11/4 Zita Folkets Bio. För tider och biljetter: <a href=\"https://zita.se/start/filmer/mordarens-son\">Klicka här!</a></p>\n<p>12/4 Zita Folkets Bio. För tider och biljetter: <a href=\"https://zita.se/start/filmer/mordarens-son\">Klicka här!</a></p>\n<p>13/4 Zita Folkets Bio. För tider och biljetter: <a href=\"https://zita.se/start/filmer/mordarens-son\">Klicka här! </a></p>\n<p>13/4 Bio Aspen. För tider och biljetter: <a href=\"https://www.bioaspen.se/movies/mordarens-son/\">Klicka här!</a></p>\n<p>14/4 Zita Folkets Bio. För tider och biljetter: <a href=\"https://zita.se/start/filmer/mordarens-son\">Klicka här!</a></p>\n<p>15/4 Zita Folkets Bio. För tider och biljetter: <a href=\"https://zita.se/start/filmer/mordarens-son\">Klicka här! </a></p>\n<p>16/4 Zita Folkets Bio. För tider och biljetter: <a href=\"https://zita.se/start/filmer/mordarens-son\">Klicka här! </a></p>\n<p>18/4 Visning + samtal på Zita Folkets Bio. För tider och biljetter: <a href=\"https://zita.se/mordarens-son\">Klicka här!</a></p>\n<p>21/4 Bio Aspen. För tider och biljetter: <a href=\"https://www.bioaspen.se/movies/mordarens-son/\">Klicka här! </a></p>\n<p>27/9 Farsta &#8211; Fanfaren Film i Farsta med regissörsbesök</p>\n<p>&nbsp;</p>\n<p><strong>MALMÖ:</strong></p>\n<p class=\"p1\">30/3 Galapremiär + Live: Rankz + samtal på Doc Lounge Malmö: <a href=\"https://billetto.se/e/doc-lounge-pres-galapremiar-av-mordarens-son-eftersnack-biljetter-1837103?utm_source=organiser&amp;utm_medium=share&amp;utm_campaign=copy_link&amp;utm_content=1\">tider &amp; biljetter</a></p>\n<p>15/4 Visning + samtal på Panora: <a href=\"https://panora.se/events/mordarens-son-samtal/\">tider &amp; biljetter</a></p>\n<p>7/5 Panora. För tider och biljetter: <a href=\"https://panora.se/filmer/mordarens-son/\">Klicka här!</a></p>\n<p>5/6 Mötesplats Helamalmö i Nydala (besök med Tabaré)</p>\n<p>&nbsp;</p>\n<p><strong>UPPSALA:</strong></p>\n<p>12/4 Visning med samtal Fyrisbiografen. För tider och biljetter: <a href=\"https://fyrisbiografen.se/mordarens-son\">Klicka här!</a></p>\n<p>&nbsp;</p>\n<p><strong>LUND:</strong></p>\n<p>16/4 Visning + samtal på Kino. För tider och biljetter: <a href=\"https://kino.nu/mordarens-son\">Klicka här!</a></p>\n<p>&nbsp;</p>\n<p><strong>LULEÅ</strong></p>\n<p>25/4 Visning med samtal på Royal, Folkets Bio Luleå. För tider och biljetter: <a href=\"https://bioseplus.se/webb/lulea/mordarens-son#visningar\">Klicka här!</a></p>\n<p>&nbsp;</p>\n<p><strong>ÖLAND</strong></p>\n<p>11/10 Visning med samtal på Torngårds Bio i Degerhamn</p>\n<p>&nbsp;</p>\n<p><strong>PERSTORP</strong></p>\n<p>27/5 Församlingshemmet (visning + samtal)</p>\n<p><strong>BORÅS</strong></p>\n<p>8/9 Röda Kvarn (visning + samtal)</p>\n<p><strong>HJO</strong></p>\n<p>9/9 Biografen Park i Hjo (visning + samtal)</p>\n<p><strong>DEGERHAMN, ÖLAND</strong></p>\n<p>11/10 Tongårds Bio</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><em>“Mördarens son är en film om att födas in i ett arv man aldrig bett om. Om klass, våld och de strukturer som formar ett liv långt innan en människa själv får välja.”</em></p>\n<p>&nbsp;</p>\n<p><strong>SYNOPSIS</strong></p>\n<p data-start=\"267\" data-end=\"469\"><em data-start=\"267\" data-end=\"282\">Mördarens son</em> är ett naket och gripande porträtt av Tabaré, en man som genom musik och boxning försöker lämna kriminaliteten bakom sig samtidigt som han konfronterar barndomens djupt begravda trauman.</p>\n<p data-start=\"471\" data-end=\"885\">Redan som treåring blev Tabaré en del av fängelsevärlden när hans far dömdes till livstids fängelse för ett dubbelmord och hans mor till ett långt straff för medhjälp. Syskonen skildes åt och Tabaré placerades i familjehem. De fragmentariska minnen som finns kvar vittnar om en uppväxt präglad av utsatthet, våld och ett samhällssystem som gång på gång misslyckades med att ingripa trots upprepade orosanmälningar.</p>\n<p data-start=\"887\" data-end=\"1218\">I dag är Tabaré 28 år och nyligen frigiven efter ett fängelsestraff för narkotikabrott. Med en stark vilja att förändra sitt liv söker han nya vägar genom musiken och boxningen. När hans frånvarande far, som numera arbetar som terapeut, oväntat återvänder tvingas Tabaré möta frågor om skuld, ansvar och möjligheten till försoning.</p>\n<p data-start=\"1220\" data-end=\"1570\">Berättelsen fördjupas ytterligare när en nära vän mördas och minnen väcks till liv av ett förlorat syskon, en barndom bakom stängda dörrar och ett dop som ägde rum bakom fängelsemurar. <em data-start=\"1405\" data-end=\"1420\">Mördarens son</em> skildrar kampen för att bryta ett arv av våld och tystade trauman i ett samhälle där det man föds in i ofta väger tyngre än de val man försöker göra.</p>\n<p><span style=\"font-weight: 400;\">➤ </span><b>Speltid:</b><span style=\"font-weight: 400;\"> 82 min</span></p>\n<p><span style=\"font-weight: 400;\">➤ </span><b>Språk:</b><span style=\"font-weight: 400;\"> Svenska</span></p>\n<p><span style=\"font-weight: 400;\">➤ </span><b>Undertexter:</b><span style=\"font-weight: 400;\"> Engelska</span></p>\n<p><span style=\"font-weight: 400;\">➤ </span><b>Åldersgräns: </b><span style=\"font-weight: 400;\">11</span></p>\n<p><span style=\"font-weight: 400;\">➤ </span><b>Regissörer:</b><span style=\"font-weight: 400;\"> Jesper Klemedsson Sotomayor, Sebastian Peña Rojas</span></p>\n<p><span style=\"font-weight: 400;\">➤ </span><b>År:</b><span style=\"font-weight: 400;\"> 2026</span></p>\n<p><span style=\"font-weight: 400;\">➤ </span><b>Svensk distributör:</b><span style=\"font-weight: 400;\"> Doc Lounge</span></p>\n<p>Doc Lounge är en stolt distributör av Mördarens son. Filmen finns att boka för repertoar- och specialvisningar med publiksamtal med huvudkaraktären Tabaré, mer känd som Rankz.</p>\n<p>För mer information och bokning: maja@doclounge.se</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n", "info": {"directors": [{"director": "Jesper Klemedsson Sotomayor, Sebastian Peña Rojas"}], "differentTitle": {"title": null, "text": null}, "originalTitle": "Mördarens son", "time": 82}}}}}}</script>
