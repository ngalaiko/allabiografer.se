name: Update

# Update the programme in the production store, then release it through CI.
# Problems with sources are filed in one issue; their feeds keep their previous screenings.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One writer of production at a time: updates and deploys queue, never overlap.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      # Immutable objects only: a cold cache costs time, never correctness.
      - uses: actions/cache@v4
        with:
          path: data/allabiografer/.cache
          key: store-${{ github.run_id }}
          restore-keys: store-
      - name: Update
        id: update
        # Problems with sources still build a programme; only a failure to build one stops the release.
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_JURISDICTION: ${{ vars.R2_JURISDICTION }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          PROBLEMS: problems.md
        run: nix run .#run -- --production --no-render
      - name: Stop when no programme was built
        if: steps.update.outcome == 'failure' && hashFiles('problems.md') == ''
        run: |
          echo "::error::The update built no programme; nothing is released"
          exit 1
      # One open issue tracks problems: an update with problems comments on it, a clean one closes it.
      - name: Report problems
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.update.outcome }}
          PROBLEMS: problems.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Programme update problems"
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [[ "$OUTCOME" == success ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --comment "Resolved by $RUN_URL"
            fi
            exit 0
          fi
          {
            echo "Run: $RUN_URL"
            echo
            if [[ -s "$PROBLEMS" ]]; then cat "$PROBLEMS"; else echo "The update failed before reporting; see the log."; fi
          } > body.md
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
          echo "::warning::The programme update had problems; see $title"

  release:
    needs: update
    uses: ./.github/workflows/ci.yml
    secrets: inherit
