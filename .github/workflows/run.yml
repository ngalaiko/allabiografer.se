name: Run

# Update the programme in the production store, render and deploy it; file problems as an issue.
permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the rendered site
        type: boolean
        default: true
  push:
    branches: [master]

concurrency:
  group: run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      # Immutable objects only: a cold cache costs time, never correctness.
      - uses: actions/cache@v4
        with:
          path: data/allabiografer/.cache
          key: store-${{ github.run_id }}
          restore-keys: store-
      - name: Run
        id: run
        # A failed source keeps its previous screenings; the site still deploys.
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_JURISDICTION: ${{ vars.R2_JURISDICTION }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          PROBLEMS: problems.md
        # Code changes re-render the latest result; the schedule fetches.
        run: |
          if [[ "${{ github.event_name }}" == push ]]; then
            nix run .#run -- --production --render-only
          else
            nix run .#run -- --production
          fi
      # A source problem still deploys: its feeds keep their previous screenings.
      # Anything else that failed the run (no programme rendered) does not.
      - name: Deploy
        if: (steps.run.outcome == 'success' || hashFiles('problems.md') != '') && (github.event_name != 'workflow_dispatch' || inputs.deploy)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: nix run .#deploy
      # One open issue tracks problems: a failed run updates it, a clean scheduled run closes it.
      - name: Report problems
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status == 'success' && steps.run.outcome || 'failure' }}
          PROBLEMS: problems.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          title="Programme update problems"
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [[ "$OUTCOME" == success ]]; then
            if [[ -n "$issue" && "$EVENT" == schedule ]]; then
              gh issue close "$issue" --comment "Resolved by $RUN_URL"
            fi
            exit 0
          fi
          {
            echo "Run: $RUN_URL"
            echo
            if [[ -s "$PROBLEMS" ]]; then cat "$PROBLEMS"; else echo "The run failed before reporting; see the log."; fi
          } > body.md
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
          echo "::error::The programme update had problems; see $title"
          exit 1
