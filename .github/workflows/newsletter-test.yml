name: Newsletter test email

on:
  workflow_dispatch:
    inputs:
      email:
        description: Send one real test email to this address
        required: true
        type: string
      city:
        description: City name (for example Göteborg)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: newsletter-test
  cancel-in-progress: false

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Send one test email through PostHog
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_JURISDICTION: ${{ vars.R2_JURISDICTION }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_NEWSLETTER_TEST_WORKFLOW: ${{ vars.POSTHOG_NEWSLETTER_TEST_WORKFLOW }}
          EMAIL: ${{ inputs.email }}
          CITY: ${{ inputs.city }}
        run: nix run .#newsletter -- --production --test-email "$EMAIL" --city "$CITY"
