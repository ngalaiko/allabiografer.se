name: Newsletter

on:
  schedule:
    - cron: "0 9 * * 4"
      timezone: Europe/Stockholm
  workflow_dispatch:
    inputs:
      migration_dry_run:
        description: Preview the newsletter preferences migration without writes or emails
        type: boolean
        default: false
      stage_backend:
        description: Stage existing newsletter credentials in Fly without deploying
        type: boolean
        default: false
      send:
        description: Send real emails to registered subscribers; otherwise create previews
        type: boolean
        default: false
      date:
        description: Thursday edition date for previews (YYYY-MM-DD), blank for today
        type: string

permissions:
  contents: read

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  stage-backend:
    if: github.event_name == 'workflow_dispatch' && inputs.stage_backend
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Stage newsletter credentials in Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          names = ("POSTHOG_PERSONAL_API_KEY", "POSTHOG_PROJECT_ID")
          values = [os.environ[name] for name in names]
          if any(not value or "\n" in value for value in values):
              raise SystemExit("Missing or invalid newsletter configuration")
          subprocess.run(
              ["flyctl", "secrets", "import", "--stage", "--app", "allabiografer-se"],
              input="".join(f"{name}={value}\n" for name, value in zip(names, values)),
              text=True,
              check=True,
          )
          PY

  migration-dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.migration_dry_run && !inputs.stage_backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Preview preferences migration (read only)
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
        run: |
          uv run --locked python - <<'PY'
          import secrets
          from newsletter import PostHog
          from newsletter.migrate import migrate

          # Exercise signing without exposing the production secret to this preview.
          # No generated identifier, token or property is written to PostHog.
          counts = migrate(PostHog(), secrets.token_hex(32), apply=False)
          print("Dry run (no writes; ephemeral preview signing key)", counts)
          PY

  send:
    if: "!inputs.migration_dry_run && !inputs.stage_backend && (github.event_name == 'workflow_dispatch' || vars.NEWSLETTER_ENABLED == 'true')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: jdx/mise-action@v2
      - name: Discover subscribed cities and prepare or send
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_NEWSLETTER_WORKFLOW: ${{ vars.POSTHOG_NEWSLETTER_WORKFLOW }}
          EVENT: ${{ github.event_name }}
          SEND: ${{ inputs.send }}
          DATE: ${{ inputs.date }}
        run: |
          args=(--output newsletter-preview)
          if [[ -n "$DATE" ]]; then args+=(--date "$DATE"); fi
          if [[ "$EVENT" == schedule || "$SEND" == true ]]; then
            args+=(--send)
          fi
          uv run newsletter "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newsletter-preview
          path: newsletter-preview/
          if-no-files-found: ignore
