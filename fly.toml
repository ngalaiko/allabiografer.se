# Deployed by `nix run .#deploy`: a Nix-built server image with the rendered site as a layer.
app = 'allabiografer-se'
primary_region = 'arn'

[env]
  POSTHOG_PROJECT_TOKEN = 'phc_BMbekuviuGc4cCqzgcoJ7Q2MiETp2yL8WEojww4Kzxjq'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '5s'
    interval = '30s'
    method = 'GET'
    path = '/robots.txt'
    timeout = '5s'

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
